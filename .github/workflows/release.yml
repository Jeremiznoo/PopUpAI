# Builds the Fedora package (.rpm) and attaches it to a GitHub pre-release when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0). It is built in a Fedora container, because a binary built on
# one distribution does not run on another (different Qt and libc). The .deb is built by hand in a Debian
# container (see docs/RELEASING.md) and added to the release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git rpm-build rust cargo gcc-c++ cmake qt6-qtbase-devel qt6-qtdeclarative-devel desktop-file-utils
      - uses: actions/checkout@v4
      - name: Source tarball and build
        run: |
          git config --global --add safe.directory "$PWD"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --format=tar.gz --prefix="popupai-${version}/" -o ~/rpmbuild/SOURCES/popupai-${version}.tar.gz HEAD
          sed -i "s/^Version:.*/Version:        ${version}/" packaging/rpm/popupai.spec
          rpmbuild -ba packaging/rpm/popupai.spec
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

  publish:
    needs: [rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "PopUpAI $GITHUB_REF_NAME" --generate-notes --prerelease
