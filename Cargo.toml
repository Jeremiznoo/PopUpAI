[workspace]
resolver = "3"
members = [
    "crates/popupai-core",
    "crates/popupai-security",
    "crates/popupai-ai",
    "crates/popupai-platform",
    "crates/popupai-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# Not publishable until a license is chosen (see README).
publish = false

[workspace.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
# Default TLS is rustls; `system-proxy` stays on so corporate proxies work.
# Pure-Rust crypto for the Secret Service session (no OpenSSL), zbus on Tokio.
secret-service = { version = "5.2", default-features = false, features = ["rt-tokio-crypto-rust"] }
# StatusNotifierItem tray (KDE Plasma, and GNOME with the AppIndicator extension).
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"
# Version 5 is what ashpd, ksni and the Secret Service store need, so one copy is built.
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
