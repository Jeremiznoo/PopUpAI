[package]
name = "popupai-app"
description = "PopUpAI desktop application: the Qt/QML popup connected to the Rust core."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The cxx-qt bridge expands to unsafe code, so this crate cannot use the
# workspace-wide `forbid(unsafe_code)`. Unsafe code is only allowed on the bridge
# module; everything else in this crate is checked by `deny`.
[[bin]]
name = "popupai"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
popupai-core = { path = "../popupai-core" }
popupai-platform = { path = "../popupai-platform" }
popupai-security = { path = "../popupai-security" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
